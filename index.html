const rub=n=>n.toLocaleString('ru-RU').replace(/ /g,' ')+' ₽';
const SER=['Все','Гранд','Лес','Дом','Настольные и декоративные'];
const f=document.getElementById('f'),L=document.getElementById('list');
let cur='Все';
SER.forEach(s=>{const b=document.createElement('button');b.textContent=s==='Настольные и декоративные'?'Настольные':s;b.onclick=()=>{cur=s;render();scrollTo({top:document.querySelector('nav').offsetTop,behavior:'smooth'})};f.appendChild(b)});
function card(m){
  const c=document.createElement('article');c.className='card';
  c.innerHTML=`<div class="ph"><img loading="lazy" alt="${m.name}"><span class="art">${m.art}</span><span class="from"></span></div>
  <div class="body"><h2>${m.name}</h2><div class="ser">Серия «${m.series}»</div><div class="vars"></div><table></table></div>`;
  const img=c.querySelector('img'),vs=c.querySelector('.vars'),t=c.querySelector('table'),fr=c.querySelector('.from');
  const show=i=>{const v=m.vars[i];if(v.img)img.src=v.img;
    fr.textContent=v.min?'от '+rub(v.min):'цена по запросу';
    t.innerHTML=v.rows.map(r=>`<tr><td>${r.h} см${r.l?`<small>${r.l} ламп.</small>`:''}</td><td>${r.p?rub(r.p):'<span class="ask">по запросу</span>'}</td></tr>`).join('');
    [...vs.children].forEach((b,j)=>b.classList.toggle('on',j===i))};
  if(m.vars.length>1)m.vars.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.label[0].toUpperCase()+v.label.slice(1);b.onclick=()=>show(i);vs.appendChild(b)});
  else vs.remove();
  show(0);return c}
function render(){[...f.children].forEach((b,i)=>b.classList.toggle('on',SER[i]===cur));
  L.replaceChildren(...D.filter(m=>cur==='Все'||m.series===cur).map(card))}
